; Diagnostic du plancher de veille (T5 V2.4) — projet INDÉPENDANT du firmware.
; Une configuration de sommeil par réveil (20 s chacune), voir src/main.cpp et
; docs/CONSOMMATION.md. Usage :
;   cd tools/sleep_floor && ~/.platformio/penv/bin/pio run --target upload
; puis USB débranché, carte alimentée par le PPK2 :
;   script de mesure PPK2 (--power-cycle --seconds 150), voir docs/CONSOMMATION.md
[env:t5]
platform = espressif32
board = mhetesp32devkit
framework = arduino
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C99017166-if00
