; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:upesy_wroom]
platform = espressif32
board = mhetesp32devkit
framework = arduino
; Port par IDENTIFIANT STABLE de la carte (puce USB-série CH9102 de la T5 V2.4),
; pas /dev/ttyACM0 : le numéro ACMx dépend de l'ordre de branchement. Avec un
; PPK2 branché (mesure de conso), il prend ACM0/ACM1 et la carte passe en ACM2 —
; flasher « ACM0 » écrirait sur le PPK2. Autre carte : `ls /dev/serial/by-id/`.
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C99017166-if00
monitor_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C99017166-if00

monitor_speed = 115200

# Optimisations pour l'autonomie
board_build.arduino.lto = true
build_flags = -Os

lib_deps = 
	zinggjm/GxEPD2@^1.5.0
	bogde/HX711@^0.7.5
	knolleary/PubSubClient@^2.8

# ESPDateTime n'est plus nécessaire, on utilise le time.h natif
