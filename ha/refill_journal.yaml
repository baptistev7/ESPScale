# =============================================================================
# ESP Scale — Home Assistant : journal des remplissages
# =============================================================================
# Historique cumulé des refills (quand, combien de kg, nb sacs, prix du sac).
# Le journal est un input_text multiligne, préfixé par les plus récents.
# L'automation "Scale - Remplissage déclaré" (automations.yaml) y ajoute une
# ligne à chaque scale/refill/event.

input_text:
  scale_refill_journal:
    name: "Journal des remplissages"
    max: 255
    mode: text
    icon: mdi:notebook-outline

  scale_refill_last:
    name: "Dernier remplissage"
    max: 255
    mode: text
    icon: mdi:package-variant-closed
