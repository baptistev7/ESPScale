# =============================================================================
# ESP Scale — Home Assistant : capteurs MQTT (À FUSIONNER, pas un package)
# =============================================================================
# ⚠️  L'intégration MQTT NE PEUT PAS être configurée via packages/.
# Ce bloc doit être fusionné dans le bloc `mqtt:` de configuration.yaml
# (il n'est donc PAS poussé par sync.sh — c'est un fichier d'infra).
#
# Topics publiés par la balance :
#   scale/value          poids NET de granulés (kg, retain)  ex "450"
#                       (tare du silo déjà soustraite par la balance)
#   scale/battery        niveau batterie (%)               ex "87"
#   scale/version        version du firmware (retain)      ex "1.1.0"
#   scale/error/on-off   "on" = 0/4 capteurs (dédock OU panne — non
#                       distinguables : voir quality.mode)
#   scale/quality        JSON {"valid":N,"mode":"ok|degraded|dedock"}
#   scale/refill/event   JSON {"added_kg":..,"bag_price_eur":..,"bag_count":..}
#
# ---------------------------------------------------------------------------
# Copier-coller SOUS le bloc `mqtt:` existant de configuration.yaml :
# ---------------------------------------------------------------------------
  sensor:
    - name: "Scale Poids"
      unique_id: scale_weight
      state_topic: "scale/value"
      unit_of_measurement: "kg"
      device_class: weight
      state_class: measurement
      force_update: true

    - name: "Scale Batterie"
      unique_id: scale_battery
      state_topic: "scale/battery"
      unit_of_measurement: "%"
      device_class: battery
      state_class: measurement

    - name: "Scale Version"
      unique_id: scale_version
      state_topic: "scale/version"
      icon: mdi:chip

    - name: "Scale Qualité"
      unique_id: scale_quality
      state_topic: "scale/quality"
      json_attributes_topic: "scale/quality"
      value_template: "{{ value_json.mode }}"

  binary_sensor:
    # `on` = la balance n'a PAS de poids fiable (0/4). Deux causes distinctes,
    # que ce capteur ne sépare pas : le boîtier hors de sa base (dedock), ou une
    # panne de capteurs. Pour la cause, lire sensor.scale_qualite (scale/quality
    # → mode = "dedock" | "degraded" | "ok").
    - name: "Scale Erreur"
      unique_id: scale_error
      state_topic: "scale/error/on-off"
      payload_on: "on"
      payload_off: "off"
      device_class: problem
